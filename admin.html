<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin Antrean - BMKG Banjarbaru</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Header Admin -->
  <header class="main-header">
    <div class="header-container">
      <div class="brand">
        <div class="logo-badge">BMKG</div>
        <div class="brand-text">
          <h2>STASIUN KLIMATOLOGI</h2>
          <span>DASHBOARD PETUGAS LOKET</span>
        </div>
      </div>
      <div class="header-right">
        <a href="index.html" class="cta-button" style="text-decoration: none; background: #64748b;">
          <span>🏠 Kembali ke Beranda</span>
        </a>
      </div>
    </div>
  </header>

  <main class="ticket-page-container" style="max-width: 1100px; margin: 2rem auto; padding: 0 1rem;">
    
    <!-- Box Antrean Dipanggil -->
    <div class="card" style="background: var(--primary-color, #0284c7); color: white; text-align: center; padding: 2rem; border-radius: 12px; margin-bottom: 2rem;">
      <small style="text-transform: uppercase; letter-spacing: 1px; opacity: 0.9;">Antrean Dipanggil Saat Ini</small>
      <h1 id="adminCurrentCode" style="font-size: 3.5rem; margin: 0.5rem 0;">---</h1>
      <p id="adminCurrentInfo" style="margin-bottom: 1.5rem; opacity: 0.9;">Belum ada tiket dipanggil</p>

      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button onclick="panggilUlang()" class="cta-button" style="background: white; color: #0284c7;">🔊 Panggil Ulang</button>
        <button onclick="selesaiLayanan()" class="cta-button" style="background: #22c55e;">✓ Selesai Dilayani</button>
        <button onclick="panggilBerikutnya()" class="cta-button" style="background: #eab308;">⏩ Panggil Berikutnya</button>
      </div>
    </div>

    <!-- Tabel Antrean Menunggu -->
    <div class="card" style="margin-bottom: 2rem; padding: 1.5rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 style="margin: 0;">📋 DAFTAR ANTREAN MENUNGGU</h3>
        <button onclick="resetSemuaData()" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">🗑️ Reset Semua Data</button>
      </div>

      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: left;">
          <thead>
            <tr style="border-bottom: 2px solid #e2e8f0; background: #f8fafc;">
              <th style="padding: 10px;">No. Tiket</th>
              <th style="padding: 10px;">Nama Pemohon</th>
              <th style="padding: 10px;">Instansi</th>
              <th style="padding: 10px;">Jenis Layanan</th>
              <th style="padding: 10px;">Waktu Daftar</th>
            </tr>
          </thead>
          <tbody id="tableWaitingBody">
            <!-- Render otomatis via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Tabel Riwayat Selesai -->
    <div class="card" style="padding: 1.5rem;">
      <h3 style="margin: 0 0 1rem 0;">📊 RIWAYAT ANTREAN SELESAI</h3>
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: left;">
          <thead>
            <tr style="border-bottom: 2px solid #e2e8f0; background: #f8fafc;">
              <th style="padding: 10px;">No. Tiket</th>
              <th style="padding: 10px;">Nama Pemohon</th>
              <th style="padding: 10px;">Instansi</th>
              <th style="padding: 10px;">Layanan</th>
              <th style="padding: 10px;">Status</th>
            </tr>
          </thead>
          <tbody id="tableDoneBody">
            <!-- Render otomatis via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    function loadAdminData() {
      const tickets = JSON.parse(localStorage.getItem('bmkg_queue_tickets')) || [];
      
      const calling = tickets.find(t => t.status === 'calling');
      const waiting = tickets.filter(t => t.status === 'waiting');
      const done = tickets.filter(t => t.status === 'done');

      // Update Box Utama
      const codeEl = document.getElementById('adminCurrentCode');
      const infoEl = document.getElementById('adminCurrentInfo');

      if (calling) {
        codeEl.innerText = calling.code;
        infoEl.innerText = `${calling.nama} (${calling.instansi}) - ${calling.layanan}`;
      } else {
        codeEl.innerText = '---';
        infoEl.innerText = 'Belum ada tiket dipanggil';
      }

      // Render Tabel Menunggu
      const waitingBody = document.getElementById('tableWaitingBody');
      if (waiting.length === 0) {
        waitingBody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 15px; color: #64748b;">Tidak ada antrean menunggu saat ini.</td></tr>`;
      } else {
        waitingBody.innerHTML = waiting.map(t => `
          <tr style="border-bottom: 1px solid #e2e8f0;">
            <td style="padding: 10px; font-weight: bold;">${t.code}</td>
            <td style="padding: 10px;">${t.nama}</td>
            <td style="padding: 10px;">${t.instansi}</td>
            <td style="padding: 10px;">${t.layanan}</td>
            <td style="padding: 10px;">${t.jam}</td>
          </tr>
        `).join('');
      }

      // Render Tabel Selesai
      const doneBody = document.getElementById('tableDoneBody');
      if (done.length === 0) {
        doneBody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 15px; color: #64748b;">Belum ada antrean selesai.</td></tr>`;
      } else {
        doneBody.innerHTML = done.map(t => `
          <tr style="border-bottom: 1px solid #e2e8f0;">
            <td style="padding: 10px; font-weight: bold;">${t.code}</td>
            <td style="padding: 10px;">${t.nama}</td>
            <td style="padding: 10px;">${t.instansi}</td>
            <td style="padding: 10px;">${t.layanan}</td>
            <td style="padding: 10px;"><span style="background: #dcfce7; color: #166534; padding: 3px 8px; border-radius: 4px; font-size: 0.85rem;">Selesai</span></td>
          </tr>
        `).join('');
      }
    }

    function panggilBerikutnya() {
      let tickets = JSON.parse(localStorage.getItem('bmkg_queue_tickets')) || [];
      
      // Jika ada yang sedang dipanggil, tandai selesai dulu
      const currentCallingIdx = tickets.findIndex(t => t.status === 'calling');
      if (currentCallingIdx !== -1) {
        tickets[currentCallingIdx].status = 'done';
      }

      // Cari antrean waiting pertama
      const nextIdx = tickets.findIndex(t => t.status === 'waiting');
      if (nextIdx !== -1) {
        tickets[nextIdx].status = 'calling';
        localStorage.setItem('bmkg_queue_tickets', JSON.stringify(tickets));
        loadAdminData();
      } else {
        alert('Tidak ada antrean yang menunggu!');
      }
    }

    function selesaiLayanan() {
      let tickets = JSON.parse(localStorage.getItem('bmkg_queue_tickets')) || [];
      const currentCallingIdx = tickets.findIndex(t => t.status === 'calling');
      
      if (currentCallingIdx !== -1) {
        tickets[currentCallingIdx].status = 'done';
        localStorage.setItem('bmkg_queue_tickets', JSON.stringify(tickets));
        loadAdminData();
      } else {
        alert('Tidak ada tiket yang sedang dipanggil.');
      }
    }

    function panggilUlang() {
      const tickets = JSON.parse(localStorage.getItem('bmkg_queue_tickets')) || [];
      const calling = tickets.find(t => t.status === 'calling');
      if (calling) {
        alert(`Memanggil ulang nomor antrean ${calling.code}`);
      } else {
        alert('Belum ada tiket yang dipanggil.');
      }
    }

    function resetSemuaData() {
      if (confirm('Apakah Anda yakin ingin menghapus seluruh data antrean?')) {
        localStorage.removeItem('bmkg_queue_tickets');
        loadAdminData();
      }
    }

    // Jalankan dan sinkronkan secara realtime
    window.addEventListener('DOMContentLoaded', loadAdminData);
    window.addEventListener('storage', loadAdminData);
  </script>
</body>
</html>
